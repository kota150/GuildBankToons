# Builds GuildBankToons.zip and publishes it whenever a version tag (like v1.2.0) is pushed.
# Uploads to CurseForge once the CF_API_KEY secret and the TOC's X-Curse-Project-ID are set;
# until then it still creates a GitHub release with the ZIP attached.
name: Package and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2

      # The Discord companion and its installer, as a second download on the GitHub release (not on CurseForge).
      - name: Attach the Discord companion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "UnNinjaBank-Companion"
          cp companion/guildbanktoons_discord.py companion/install.py companion/guildbanktoons.example.json \
             "companion/Install on Windows.bat" "companion/Install on Mac.command" companion/install-linux.sh \
             companion/README.txt UnNinjaBank-Companion/
          zip -r UnNinjaBank-Companion.zip UnNinjaBank-Companion
          gh release upload "$GITHUB_REF_NAME" UnNinjaBank-Companion.zip --clobber
